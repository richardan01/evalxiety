name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Never call the Claude API from CI.
      MOCK_MODE: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Nothing that must stay private (env files, keys, data/private, your own agents, spreadsheets, credentials).
      - run: npm run check:files
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
